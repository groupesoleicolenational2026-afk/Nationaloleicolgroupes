<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الإدارة الجهوية - قطاع زيت الزيتون</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: auto; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        th { background: #1e293b; color: white; padding: 15px; text-align: right; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: right; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-success { background: #dcfce7; color: #166534; }
        .status-danger { background: #fee2e2; color: #991b1b; }
        .delete-btn { background: #dc2626; color: white; border: none; padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; transition: background 0.3s; }
        .delete-btn:hover { background: #b91c1c; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: #1e293b; margin-bottom: 5px;">📊 لوحة تحكم الإدارة الجهوية</h1>
    <p style="color: #666; margin-bottom: 25px;">متابعة طلبات المنخرطين، الإحصائيات، وتدبير السجلات المحلية</p>

    <!-- الرسوم البيانية الإحصائية -->
    <div class="dashboard-grid">
        <div class="card"><canvas id="provincesChart"></canvas></div>
        <div class="card"><canvas id="statusChart"></canvas></div>
    </div>

    <!-- جدول المنخرطين مع خاصية الحذف الموضعي -->
    <div class="card">
        <h3 style="margin-top: 0; color: #1e293b;">قائمة المنخرطين المسجلين في الجهة</h3>
        <table>
            <thead>
                <tr>
                    <th>تاريخ الإنضمام</th>
                    <th>التسمية التجارية</th>
                    <th>طبيعة النشاط</th>
                    <th>الترخيص الصحي</th>
                    <th>الإقليم / الجماعة</th>
                    <th>الوضعية</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="submissionsTableBody">
                <tr><td colspan="7" style="text-align: center; color: #666; padding: 20px;">جاري تحميل البيانات...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://jjexwbowhasmvwjvvkdk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_3PZs80WVHFENf398x7KN2A_pesAX-Nm';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ⚠️ قم بتغيير رقم الجهة هنا حسب الملف (1: مراكش، 2: بني ملال، 3: فاس، 4: الشرق، 5: طنجة)
    const regionId = 2; 
    let provincesChartInstance = null;
    let statusChartInstance = null;

    async function initDashboard() {
        await fetchData();
    }

    async function fetchData() {
        const { data, error } = await supabaseClient
            .from('submissions')
            .select(`*, provinces (name_ar)`)
            .eq('region_id', regionId)
            .order('created_at', { ascending: false });

        if (error) {
            console.error('خطأ في جلب البيانات:', error);
            return;
        }

        renderTable(data);
        renderCharts(data);
    }

    // دالة حذف التسجيل الخاطئ أو المكرر
    async function deleteSubmission(id) {
        if (!confirm('هل أنت متأكد من رغبتك في حذف هذا التسجيل نهائياً؟')) return;

        const recordId = isNaN(id) ? id : Number(id);

        const { error } = await supabaseClient
            .from('submissions')
            .delete()
            .eq('id', recordId);

        if (error) {
            alert('حدث خطأ أثناء محاولة الحذف.');
            console.error(error);
        } else {
            alert('تم حذف التسجيل بنجاح.');
            fetchData(); // تحديث الجدول فوراً
        }
    }

    function renderCharts(data) {
        const provinceCounts = {};
        data.forEach(d => {
            const provName = d.provinces?.name_ar || 'غير محدد';
            provinceCounts[provName] = (provinceCounts[provName] || 0) + 1;
        });
        
        const statusCounts = { 'نعم': 0, 'في طور الإنجاز': 0, 'لا': 0 };
        data.forEach(d => {
            if (statusCounts[d.license_status] !== undefined) {
                statusCounts[d.license_status]++;
            } else {
                statusCounts[d.license_status] = 1;
            }
        });

        const ctxProv = document.getElementById('provincesChart').getContext('2d');
        if (provincesChartInstance) provincesChartInstance.destroy();
        provincesChartInstance = new Chart(ctxProv, {
            type: 'doughnut',
            data: {
                labels: Object.keys(provinceCounts),
                datasets: [{ data: Object.values(provinceCounts), backgroundColor: ['#4f46e5', '#06b6d4', '#8b5cf6', '#f59e0b', '#10b981'] }]
            },
            options: { responsive: true, plugins: { title: { display: true, text: 'توزيع الطلبات حسب الأقاليم' } } }
        });

        const ctxStatus = document.getElementById('statusChart').getContext('2d');
        if (statusChartInstance) statusChartInstance.destroy();
        statusChartInstance = new Chart(ctxStatus, {
            type: 'bar',
            data: {
                labels: Object.keys(statusCounts),
                datasets: [{ label: 'عدد الوحدات', data: Object.values(statusCounts), backgroundColor: '#10b981' }]
            },
            options: { responsive: true, plugins: { title: { display: true, text: 'وضعية التراخيص الصحية (ONSSA)' } } }
        });
    }

    function renderTable(data) {
        const tbody = document.getElementById('submissionsTableBody');
        
        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #666; padding: 20px;">لا توجد طلبات مسجلة لهذه الجهة حتى الآن.</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map(d => `
            <tr>
                <td>${new Date(d.created_at).toLocaleDateString('ar-MA')}</td>
                <td><strong>${d.company_name || '-'}</strong></td>
                <td>${d.activity_nature || '-'}</td>
                <td>${d.license_status || '-'}</td>
                <td>${d.provinces?.name_ar || '-'} / ${d.commune || ''}</td>
                <td><span class="badge ${d.result && d.result.includes('قبول') ? 'status-success' : 'status-danger'}">${d.result || '-'}</span></td>
                <td>
                    <button class="delete-btn" onclick="deleteSubmission('${d.id}')">حذف</button>
                </td>
            </tr>
        `).join('');
    }

    initDashboard();

    // التحديث الفوري عند حدوث أي تغيير في قاعدة البيانات لهذه الجهة
    supabaseClient
        .channel('public:submissions-regional')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'submissions' }, payload => {
            fetchData();
        })
        .subscribe();
</script>
</body>
</html>
