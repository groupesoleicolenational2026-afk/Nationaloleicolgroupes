<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم مشرفي جهة مراكش آسفي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; background: #fff; margin: auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1e3d59; margin-bottom: 25px; }
        
        /* صندوق إدارة رابط الواتساب */
        .whatsapp-manager { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .whatsapp-manager label { font-weight: bold; color: #166534; }
        .whatsapp-input-group { display: flex; gap: 10px; }
        .whatsapp-input-group input { flex: 1; padding: 10px; border: 1px solid #86efac; border-radius: 6px; font-size: 14px; }
        .save-whatsapp-btn { background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .save-whatsapp-btn:hover { background: #16a34a; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; }
        th, td { padding: 12px 15px; border: 1px solid #e2e8f0; text-align: right; font-size: 14px; }
        th { background-color: #059669; color: white; }
        tr:nth-child(even) { background-color: #f8fafc; }
        .badge-success { background: #d1fae5; color: #065f46; padding: 5px 10px; border-radius: 6px; font-weight: bold; }
        .badge-danger { background: #fee2e2; color: #991b1b; padding: 5px 10px; border-radius: 6px; font-weight: bold; }
        .refresh-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; transition: background 0.3s; }
        .refresh-btn:hover { background: #2563eb; }
        .no-data { text-align: center; color: #666; padding: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h2>لوحة تحكم مشرفي مجموعة: جهة مراكش آسفي</h2>

    <!-- قسم تحديث رابط الواتساب مباشرة -->
    <div class="whatsapp-manager">
        <label for="whatsappLinkInput">إدارة وتحديث رابط مجموعة الواتساب الجهوية:</label>
        <div class="whatsapp-input-group">
            <input type="text" id="whatsappLinkInput" placeholder="أدخل رابط الواتساب الجديد هنا...">
            <button class="save-whatsapp-btn" onclick="updateWhatsappLink()">حفظ الرابط الجديد 💾</button>
        </div>
        <small id="whatsappStatus" style="color: #166534;"></small>
    </div>

    <button class="refresh-btn" onclick="loadSubmissions()">تحديث الطلبات 🔄</button>
    
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>التاريخ والوقت</th>
                    <th>التسمية التجارية / المعصرة</th>
                    <th>طبيعة النشاط</th>
                    <th>الترخيص</th>
                    <th>الجماعة</th>
                    <th>الوضعية</th>
                </tr>
            </thead>
            <tbody id="submissionsTableBody">
                <tr><td colspan="6" class="no-data">جاري التحميل...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://jjexwbowhasmvwjvvkdk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_3PZs80WVHFENf398x7KN2A_pesAX-Nm';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    const regionId = 1; // معرف جهة مراكش آسفي

    // جلب الرابط الحالي عند فتح الصفحة
    async function loadCurrentWhatsapp() {
        const { data, error } = await supabaseClient
            .from('regions')
            .select('whatsapp_link')
            .eq('id', regionId)
            .single();
        
        if (data && data.whatsapp_link) {
            document.getElementById('whatsappLinkInput').value = data.whatsapp_link;
        }
    }

    // حفظ الرابط الجديد في قاعدة البيانات
    async function updateWhatsappLink() {
        const newLink = document.getElementById('whatsappLinkInput').value.trim();
        const statusEl = document.getElementById('whatsappStatus');

        if (!newLink) {
            alert('الرجاء إدخال رابط صالح.');
            return;
        }

        const { error } = await supabaseClient
            .from('regions')
            .update({ whatsapp_link: newLink })
            .eq('id', regionId);

        if (error) {
            statusEl.style.color = 'red';
            statusEl.textContent = 'حدث خطأ أثناء الحفظ: ' + error.message;
        } else {
            statusEl.style.color = '#166534';
            statusEl.textContent = 'تم حفظ وتحديث رابط الواتساب بنجاح!';
            setTimeout(() => { statusEl.textContent = ''; }, 4000);
        }
    }

    async function loadSubmissions() {
        const tbody = document.getElementById('submissionsTableBody');
        tbody.innerHTML = `<tr><td colspan="6" class="no-data">جاري التحديث...</td></tr>`;

        try {
            const { data, error } = await supabaseClient
                .from('submissions')
                .select('*')
                .eq('region_id', regionId) 
                .order('id', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" class="no-data" style="color: red;">خطأ في جلب البيانات: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="no-data">لا توجد أي طلبات مسجلة حتى الآن.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(sub => {
                const tr = document.createElement('tr');
                const dateStr = sub.created_at ? new Date(sub.created_at).toLocaleString('ar-MA') : 'مدخل حديث';
                const badgeClass = sub.result === 'قبول' ? 'badge-success' : 'badge-danger';

                tr.innerHTML = `
                    <td>${dateStr}</td>
                    <td><strong>${sub.company_name}</strong></td>
                    <td>${sub.activity_nature}</td>
                    <td>${sub.license_status}</td>
                    <td>${sub.commune}</td>
                    <td><span class="${badgeClass}">${sub.result}</span></td>
                `;
                tbody.appendChild(tr);
            });

        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="6" class="no-data" style="color: red;">حدث خطأ في الاتصال بالشبكة.</td></tr>`;
        }
    }

    // تشغيل الدوال عند التحميل
    loadCurrentWhatsapp();
    loadSubmissions();
</script>
</body>
</html>
