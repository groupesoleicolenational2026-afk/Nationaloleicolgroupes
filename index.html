<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المجموعة الوطنية لأرباب المعاصر وتسويق زيت الزيتون بالمغرب - استمارة الانخراط</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --olive-dark: #3e4f3a; 
            --olive-light: #7a8b75; 
            --gold: #c5a059; 
            --cream: #f9f7f2; 
        }
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--cream); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }
        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(62, 79, 58, 0.15); 
            width: 100%; 
            max-width: 600px; 
            border: 2px solid var(--olive-light);
        }
        h2 { color: var(--olive-dark); text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--olive-dark); font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        button { background: var(--olive-dark); color: white; padding: 15px; width: 100%; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: var(--gold); }
        .success { background: #dcfce7; color: #166534; padding: 15px; border-radius: 10px; text-align: center; margin-top: 20px; }
        .danger { background: #fee2e2; color: #991b1b; padding: 15px; border-radius: 10px; text-align: center; margin-top: 20px; }
        .whatsapp-btn { display: inline-block; background: #25d366; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>استمارة الانخراط المهني</h2>
    <form id="enrollmentForm" onsubmit="submitForm(event)">
        <div class="form-group">
            <label>اسم الوحدة / الشركة:</label>
            <input type="text" id="companyName" required placeholder="أدخل اسم الوحدة">
        </div>

        <div class="form-group">
            <label>طبيعة النشاط / نوع الوحدة:</label>
            <select id="selectedUnits" required>
                <option value="">-- اختر طبيعة النشاط --</option>
                <option value="معصرة عصرية">معصرة عصرية</option>
                <option value="معصرة تقليدية">معصرة تقليدية</option>
                <option value="تسويق زيت الزيتون(لا أملك معصرة)">تسويق زيت الزيتون(لا أملك معصرة)</option>
            </select>
        </div>

        <div class="form-group">
            <label>الوضع القانوني للترخيص الصحي (ONSSA):</label>
            <select id="license" required>
                <option value="">-- اختر الحالة --</option>
                <option value="حاصل">حاصل على الترخيص</option>
                <option value="في طور الإنجاز">في طور الإنجاز</option>
                <option value="غير حاصل">غير حاصل</option>
            </select>
        </div>

        <!-- أضف باقي الحقول كالجهة والإقليم حسب تصميمك القديم -->
        
        <button type="submit">إرسال الطلب</button>
    </form>

    <div id="resultMessage"></div>
</div>

<script>
    // إعدادات اتصال Supabase (تأكد من وضع رابطك ومفتاحك الصحيحين)
    const supabaseClient = supabase.createClient('URL', 'KEY');
    const regionId = 1; // قم بتعديله حسب الجهة أو جذبه من الاستمارة

    async function submitForm(event) {
        event.preventDefault();

        const companyName = document.getElementById('companyName').value;
        const selectedUnits = document.getElementById('selectedUnits').value;
        const license = document.getElementById('license').value;
        const whatsappLink = "https://chat.whatsapp.com/your-group-link"; // رابط الواتساب الجهوي

        let finalResult = "قبول";
        let messageHTML = "";
        
        // التحقق الآلي بناءً على الشروط الجديدة
        const isMarketingOnly = (selectedUnits === "تسويق زيت الزيتون(لا أملك معصرة)");
        
        if (isMarketingOnly && license === 'غير حاصل') {
            finalResult = "تم رفض طلبك";
            messageHTML = `<div class="danger">
                <h3>🔴 عذراً، تم رفض طلبك</h3>
                <p>تم رفض طلبك (لعدم الاستيفاء القانوني للترخيص الصحي).</p>
            </div>`;
        } else if (isMarketingOnly && license === 'في طور الإنجاز') {
            finalResult = "تم رفض طلبك مؤقتا";
            messageHTML = `<div class="danger">
                <h3>🔴 عذراً، تم رفض طلبك مؤقتا</h3>
                <p>تم رفض طلبك مؤقتا (في انتظار تسوية وضعية الترخيص الصحي).</p>
            </div>`;
        } else {
            finalResult = "قبول";
            messageHTML = `<div class="success">
                <h3>🟢 مبروك، تم قبول طلبك بنجاح!</h3>
                <p>يمكنك الآن الانضمام مباشرة إلى مجموعة WhatsApp الجهوية:</p>
                <a href="${whatsappLink}" target="_blank" class="whatsapp-btn">الانضمام إلى مجموعة الواتساب الجهوية</a>
            </div>`;
        }

        // إرسال البيانات إلى جدول Supabase
        const { error } = await supabaseClient
            .from('submissions')
            .insert([
                { 
                    company_name: companyName,
                    activity_nature: selectedUnits,
                    license_status: license,
                    result: finalResult,
                    region_id: regionId
                }
            ]);

        if (error) {
            alert("حدث خطأ أثناء الإرسال، يرجى المحاولة مجدداً.");
            console.error(error);
        } else {
            // إخفاء النموذج وإظهار النتيجة للمستخدم
            document.getElementById('enrollmentForm').style.display = 'none';
            document.getElementById('resultMessage').innerHTML = messageHTML;
        }
    }
</script>
</body>
</html>
