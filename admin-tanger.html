<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم احترافية - الإدارة الجهوية</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f4f7f6; padding: 20px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .whatsapp-manager { background: #eef2ff; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-right: 5px solid #4f46e5; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
        th { background: #1e293b; color: white; padding: 15px; text-align: right; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-success { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: #1e293b;">📊 لوحة التحكم الإدارية</h1>
    
    <div class="whatsapp-manager">
        <label>رابط الواتساب:</label>
        <input type="text" id="whatsappLinkInput" style="width: 70%; padding: 8px;">
        <button onclick="updateWhatsappLink()">حفظ</button>
    </div>

    <div class="dashboard-grid">
        <div class="card"><canvas id="provincesChart"></canvas></div>
        <div class="card"><canvas id="statusChart"></canvas></div>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>تاريخ الإنضمام</th>
                    <th>التسمية</th>
                    <th>طبيعة النشاط</th>
                    <th>الترخيص</th>
                    <th>الإقليم</th>
                    <th>الوضعية</th>
                </tr>
            </thead>
            <tbody id="submissionsTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // الإعدادات (استبدل regionId لكل جهة)
    const regionId = 5; 
    const supabaseClient = supabase.createClient('URL', 'KEY');

    async function fetchData() {
        const { data } = await supabaseClient.from('submissions').select('*').eq('region_id', regionId);
        renderTable(data);
        renderCharts(data);
    }

    function renderCharts(data) {
        // حساب إحصائيات الأقاليم
        const provinceCounts = {};
        data.forEach(d => provinceCounts[d.province] = (provinceCounts[d.province] || 0) + 1);
        
        new Chart(document.getElementById('provincesChart'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(provinceCounts),
                datasets: [{ data: Object.values(provinceCounts), backgroundColor: ['#4f46e5', '#06b6d4', '#8b5cf6'] }]
            },
            options: { plugins: { title: { display: true, text: 'توزيع الطلبات حسب الأقاليم' } } }
        });

        // حساب إحصائيات التراخيص
        const statusCounts = { 'حاصل': 0, 'غير حاصل': 0, 'في طور الإنجاز': 0 };
        data.forEach(d => statusCounts[d.license_status]++);

        new Chart(document.getElementById('statusChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(statusCounts),
                datasets: [{ label: 'العدد', data: Object.values(statusCounts), backgroundColor: '#10b981' }]
            }
        });
    }

    function renderTable(data) {
        const tbody = document.getElementById('submissionsTableBody');
        tbody.innerHTML = data.map(d => `
            <tr>
                <td>${new Date(d.created_at).toLocaleDateString('ar-MA')}</td>
                <td>${d.company_name}</td>
                <td>${d.activity_nature}</td>
                <td>${d.license_status}</td>
                <td>${d.province}</td>
                <td><span class="badge status-success">${d.result}</span></td>
            </tr>
        `).join('');
    }

    fetchData();
</script>
</body>
</html>
