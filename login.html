<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المشرفين الجهويين - المجموعات الجهوية لأرباب المعاصر وتسويق زيت الزيتون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --olive-dark: #2d3b2a; 
            --olive-light: #556b2f; 
            --gold: #c5a059; 
            --cream: #f4f6f0; 
        }
        body { 
            font-family: 'Cairo', sans-serif; 
            margin: 0; 
            background: linear-gradient(135deg, rgba(45, 59, 42, 0.85), rgba(85, 107, 47, 0.8)), 
                        url('https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
            box-sizing: border-box;
        }
        .login-card { 
            background: rgba(255, 255, 255, 0.96); 
            padding: 40px; 
            border-radius: 25px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); 
            width: 100%; 
            max-width: 440px; 
            box-sizing: border-box;
            border: 2px solid var(--gold);
            text-align: center;
        }
        .logo { width: 120px; margin-bottom: 15px; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: var(--olive-dark); margin: 5px 0 10px 0; font-size: 1.25rem; line-height: 1.5; font-weight: 700; }
        p { color: #666; margin-bottom: 25px; font-size: 14px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #2b2d42; font-size: 14px; }
        select, input[type="password"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 12px; font-size: 15px; box-sizing: border-box; font-family: 'Cairo', sans-serif; outline: none; transition: border-color 0.3s; background: #fff; }
        select:focus, input[type="password"]:focus { border-color: var(--olive-light); }
        button { background: var(--olive-dark); color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; padding: 14px; border-radius: 12px; font-size: 16px; width: 100%; font-family: 'Cairo', sans-serif; transition: background 0.3s, transform 0.2s; }
        button:hover { background: var(--gold); transform: scale(1.02); }
        .error-msg { color: #dc2626; text-align: center; margin-top: 15px; font-size: 14px; display: none; font-weight: bold; background: #fee2e2; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="login-card">
    <img src="logo.png" alt="شعار المجموعة" class="logo">
    <h2>المجموعات الجهوية لأرباب المعاصر وتسويق زيت الزيتون</h2>
    <p>بوابة تسجيل دخول المشرفين الجهويين</p>

    <div class="form-group">
        <label for="admin-region">اختر الجهة:</label>
        <select id="admin-region">
            <option value="">-- اختر الجهة التابعة لك --</option>
            <option value="marrakech">جهة مراكش آسفي</option>
            <option value="bnimellal">جهة بني ملال خنيفرة</option>
            <option value="fes">جهة فاس مكناس</option>
            <option value="cherk">جهة الشرق</option>
            <option value="tanger">جهة طنجة تطوان الحسيمة</option>
        </select>
    </div>

    <div class="form-group">
        <label for="admin-pass">كلمة المرور الخاصة بالجهة:</label>
        <input type="password" id="admin-pass" placeholder="أدخل كلمة المرور السرية للجهة">
    </div>

    <button onclick="loginRegionalAdmin()">دخول لوحة الجهة</button>
    <div id="error-msg" class="error-msg">الجهة المختارة أو كلمة المرور غير صحيحة!</div>
</div>

<script>
    function loginRegionalAdmin() {
        const region = document.getElementById('admin-region').value;
        const pass = document.getElementById('admin-pass').value;
        const errorDiv = document.getElementById('error-msg');

        errorDiv.style.display = "none";

        if (!region) {
            errorDiv.textContent = "الرجاء اختيار الجهة أولاً";
            errorDiv.style.display = "block";
            return;
        }

        let targetPage = "";
        let correctPassword = "";

        // مطابقة الأسماء حرفياً مع ملفات GitHub الخاصة بك
        if (region === "marrakech") {
            targetPage = "admin-marrakech.html";
            correctPassword = "Marrakech2026"; 
        } else if (region === "bnimellal") {
            targetPage = "admin-bnimellal.html";
            correctPassword = "Bnimellal2026"; 
        } else if (region === "fes") {
            targetPage = "admin-fes.html";
            correctPassword = "Fes2026"; 
        } else if (region === "cherk") {
            targetPage = "admin-cherk.html";
            correctPassword = "Cherk2026"; 
        } else if (region === "tanger") {
            targetPage = "admin-tanger.html";
            correctPassword = "Tanger2026"; 
        }

        if (pass === correctPassword) {
            window.location.href = targetPage;
        } else {
            errorDiv.textContent = "كلمة المرور غير صحيحة لهذه الجهة";
            errorDiv.style.display = "block";
        }
    }
</script>

</body>
</html>
