<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المشرفين الجهويين | قطاع زيت الزيتون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --olive-dark: #2d3b2a; 
            --olive-light: #556b2f; 
            --gold: #c5a059; 
            --cream: #f4f6f0; 
        }
        body { 
            font-family: 'Cairo', sans-serif; 
            margin: 0; 
            background: linear-gradient(135deg, rgba(45, 59, 42, 0.85), rgba(85, 107, 47, 0.8)), 
                        url('https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
            box-sizing: border-box;
        }
        .card { 
            background: rgba(255, 255, 255, 0.96); 
            padding: 35px; 
            border-radius: 25px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); 
            text-align: center; 
            width: 100%; 
            max-width: 450px; 
            border: 2px solid var(--gold);
            box-sizing: border-box;
        }
        .logo { width: 120px; margin-bottom: 15px; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: var(--olive-dark); margin: 5px 0 10px 0; font-size: 1.2rem; line-height: 1.5; font-weight: 700; }
        p { color: #666; margin-bottom: 20px; font-size: 14px; }
        select, input[type="password"] { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 12px; font-size: 15px; box-sizing: border-box; font-family: 'Cairo', sans-serif; outline: none; background: #fff; }
        select:focus, input:focus { border-color: var(--olive-light); }
        button { background: var(--olive-dark); color: white; padding: 12px 30px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: 'Cairo', sans-serif; font-size: 16px; width: 100%; margin-top: 10px; }
        button:hover { background: var(--gold); transform: scale(1.02); }
        .error-msg { color: #dc2626; text-align: center; margin-top: 15px; font-size: 14px; display: none; font-weight: bold; background: #fee2e2; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="card">
    <img src="logo.png" alt="شعار المجموعة" class="logo">
    <h2>بوابة المشرفين الجهويين</h2>
    <p>اختر جهتك وأدخل كلمة المرور الخاصة بالإدارة الجهوية</p>
    
    <select id="regionSelect">
        <option value="">-- اختر الجهة --</option>
        <option value="1">جهة مراكش آسفي</option>
        <option value="2">جهة بني ملال خنيفرة</option>
        <option value="3">جهة فاس مكناس</option>
        <option value="4">جهة الشرق</option>
        <option value="5">جهة طنجة تطوان الحسيمة</option>
    </select>

    <input type="password" id="regionPassword" placeholder="كلمة المرور الجهوية...">
    <button onclick="loginRegionalAdmin()">تسجيل الدخول للجهة</button>
    <div id="error-msg" class="error-msg">كلمة المرور الجهوية غير صحيحة!</div>

    <!-- زر الرجوع للواجهة الرئيسية (Portail) -->
    <a href="portail.html" style="display: block; margin-top: 20px; color: #475569; text-decoration: none; font-size: 14px; font-weight: bold;">← العودة للواجهة الرئيسية (Portail)</a>
</div>

<script>
    // كلمة المرور الموحدة أو المخصصة لكل جهة حسب رغبتك الأصلية
    function loginRegionalAdmin() {
        const regionId = document.getElementById('regionSelect').value;
        const pass = document.getElementById('regionPassword').value;
        const errorDiv = document.getElementById('error-msg');
        errorDiv.style.display = "none";

        if (!regionId) {
            alert('الرجاء اختيار الجهة أولاً.');
            return;
        }

        // تحقق بسيط أو توجيه لصفحة الجهة الخاصة بناءً على الاختيار
        if (pass === "123456") {
            sessionStorage.setItem('userRole', 'regional');
            sessionStorage.setItem('regionId', regionId);

            // توجيه لملف الجهة المطابق
            const regionPages = {
                '1': 'admin-marrakech.html',
                '2': 'admin-bnimellal.html',
                '3': 'admin-fes.html',
                '4': 'admin-cherk.html',
                '5': 'admin-tanger.html'
            };

            if (regionPages[regionId]) {
                window.location.href = regionPages[regionId];
            }
        } else {
            errorDiv.style.display = "block";
        }
    }
</script>
</body>
</html>
