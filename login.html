<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المشرفين الجهويين - قطاع زيت الزيتون</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { text-align: center; color: #1e3d59; margin-bottom: 25px; font-size: 22px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #2b2d42; }
        select, input[type="password"], button { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        select:focus, input[type="password"]:focus { border-color: #3b82f6; outline: none; }
        button { background: #059669; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; transition: background 0.3s; }
        button:hover { background: #047857; }
        .error-msg { color: #dc2626; text-align: center; margin-top: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>تسجيل دخول المشرف الجهوي</h2>
    <div class="form-group">
        <label for="admin-region">اختر الجهة:</label>
        <select id="admin-region">
            <option value="">-- اختر الجهة التابعة لك --</option>
            <option value="marrakech">جهة مراكش آسفي</option>
            <option value="bnimellal">جهة بني ملال خنيفرة</option>
            <option value="fes">جهة فاس مكناس</option>
            <option value="cherk">جهة الشرق</option>
            <option value="tanger">جهة طنجة تطوان الحسيمة</option>
        </select>
    </div>

    <div class="form-group">
        <label for="admin-pass">كلمة المرور الخاصة بالجهة:</label>
        <input type="password" id="admin-pass" placeholder="أدخل كلمة المرور السرية للجهة">
    </div>

    <button onclick="loginRegionalAdmin()">دخول لوحة الجهة</button>
    <div id="error-msg" class="error-msg">الجهة المختارة أو كلمة المرور غير صحيحة!</div>
</div>

<script>
    function loginRegionalAdmin() {
        const region = document.getElementById('admin-region').value;
        const pass = document.getElementById('admin-pass').value;
        const errorDiv = document.getElementById('error-msg');

        errorDiv.style.display = "none";

        if (!region) {
            errorDiv.textContent = "الرجاء اختيار الجهة أولاً";
            errorDiv.style.display = "block";
            return;
        }

        // تحديد صفحة لوحة التحكم وكلمة المرور الخاصة بكل جهة بدقة
        // (يمكنك تغيير كلمات المرور أدناه حسب رغبتك لكل جهة)
        let targetPage = "";
        let correctPassword = "";

        if (region === "marrakech") {
            targetPage = "admin-marrakech.html";
            correctPassword = "Marrakech012026"; // كلمة مرور مراكش
        } else if (region === "bnimellal") {
            targetPage = "admin-bnimellal.html";
            correctPassword = "Bnimellal022026"; // كلمة مرور بني ملال
        } else if (region === "fes") {
            targetPage = "admin-fes.html";
            correctPassword = "Fes032026"; // كلمة مرور فاس
        } else if (region === "cherk") {
            targetPage = "admin-cherk.html";
            correctPassword = "Cherk042026"; // كلمة مرور الشرق
        } else if (region === "tanger") {
            targetPage = "admin-tanger.html";
            correctPassword = "Tanger052026"; // كلمة مرور طنجة
        }

        // التحقق من صحة كلمة المرور للجهة المعنية
        if (pass === correctPassword) {
            window.location.href = targetPage;
        } else {
            errorDiv.textContent = "كلمة المرور غير صحيحة لهذه الجهة";
            errorDiv.style.display = "block";
        }
    }
</script>

</body>
</html>
